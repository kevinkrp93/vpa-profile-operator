apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: applications
  annotations:
    vpa-scale-profile: conservative
spec:
  replicas: 2
  selector:
    matchLabels:
      app: checkout
  template:
    metadata:
      labels:
        app: checkout
    spec:
      containers:
        - name: checkout
          image: nginx:1.27
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
